# Reverse proxy for the Utkarsh Soft Solutions Node server.
# For HTTPS, obtain certificates (e.g. Let's Encrypt / certbot), mount them,
# and uncomment the 443 block.

server {
    listen 80;
    server_name utkarshsoftsolutions.com www.utkarshsoftsolutions.com;

    # security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

